# Static chat SPA. /api and /ws are routed by the edge nginx, never by this container.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Strict CSP: only our own bundled scripts may run next to the key store (XSS ⇒ key theft).
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";

    location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }

    # Runtime client settings from the container environment (filled in at start-up by the nginx image's
    # envsubst step; only SECURECHAT_* variables are substituted). ONBOARDING_ENABLED in .env → welcome tour.
    location = /config.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 '{"onboarding":"${SECURECHAT_ONBOARDING}"}';
    }

    location /assets/ {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
