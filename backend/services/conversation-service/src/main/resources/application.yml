spring:
  application:
    name: conversation-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/conversation_db}
    username: ${DB_USER:conversation_svc}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 16
      connection-timeout: 3000
  kafka:
    consumer:
      group-id: conversation-service
server:
  port: 8084
securechat:
  outbox:
    enabled: true
  security:
    public-paths:
      - /v3/api-docs/**
  conversations:
    max-group-members: 256
