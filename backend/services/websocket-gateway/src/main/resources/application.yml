spring:
  application:
    name: websocket-gateway
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      username: ${REDIS_USER:wsgateway}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  kafka:
    consumer:
      # each gateway instance has its own group (see GatewayEvents) → every instance sees every event
      auto-offset-reset: latest
server:
  port: 8089
securechat:
  security:
    public-paths:
      - /ws
      - /ws/**
  gateway:
    id: ${GATEWAY_ID:}
    allowed-origins: ${CHAT_ORIGIN:http://localhost:8100}
    auth-timeout: 5s
    connection-ttl: 60s
    token-grace: 60s
    presence-heartbeat-interval: 15s
    max-frame-bytes: 327680
    messages-per-second: 20
