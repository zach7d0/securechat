spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/user_db}
    username: ${DB_USER:user_svc}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  jackson:
    deserialization:
      # strict input: unknown fields (e.g. any key material) are rejected, never silently accepted
      fail-on-unknown-properties: true
  kafka:
    consumer:
      group-id: user-service
server:
  port: 8082
securechat:
  outbox:
    enabled: true
  security:
    public-paths:
      - /v3/api-docs/**
  users:
    max-active-devices: 16
