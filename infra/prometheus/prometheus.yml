# Scrapes the internal management ports only (never exposed through nginx).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [ /etc/prometheus/alerts.yml ]
scrape_configs:
  - job_name: securechat
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:9080
          - auth-service:9081
          - user-service:9082
          - key-service:9083
          - conversation-service:9084
          - message-service:9085
          - fanout-service:9086
          - delivery-service:9087
          - presence-service:9088
          - websocket-gateway:9089
          - websocket-gateway-2:9089
          - notification-service:9090
          - monitoring-service:9091
          - admin-service:9092
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: instance
