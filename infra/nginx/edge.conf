# SecureChat edge (the only published container). Local: HTTP on 8100 (chat) / 8101 (admin).
# EC2: deploy/ec2/nginx-tls.conf terminates TLS on 443 with the same locations.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Docker DNS; lazily resolved upstreams let the edge start before optional containers.
resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=edge_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=edge_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# `resolve` (nginx >= 1.27.3) re-resolves container names, so a recreated container's new IP is
# picked up without restarting the edge.
upstream api_gateway { zone api_gateway 64k; server api-gateway:8080 resolve; keepalive 32; }
# Two WebSocket gateways (multi-gateway routing). least_conn balances long-lived sockets.
upstream ws_gateways {
    zone ws_gateways 64k;
    least_conn;
    server websocket-gateway:8089 resolve max_fails=1 fail_timeout=5s;
    server websocket-gateway-2:8089 resolve max_fails=1 fail_timeout=5s;
}

log_format edge '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent $request_time rid=$request_id';

server {
    listen 8100;
    server_name _;
    server_tokens off;
    access_log /dev/stdout edge;          # path only (no query strings, no bodies, no tokens)
    client_max_body_size 300k;
    limit_conn edge_conn 50;

    location /api/admin/ { return 404; }  # admin API is only reachable on the admin origin

    location /api/ {
        limit_req zone=edge_api burst=60 nodelay;
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $request_id;
        proxy_set_header X-Internal-Token "";
        proxy_read_timeout 30s;
    }

    location = /ws {
        proxy_pass http://ws_gateways;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /internal/ { return 404; }
    location /actuator/ { return 404; }

    location / {
        set $chat_ui frontend:8080;
        proxy_pass http://$chat_ui;
        proxy_set_header Host $host;
    }
}

server {
    listen 8101;
    server_name _;
    server_tokens off;
    access_log /dev/stdout edge;
    client_max_body_size 64k;
    limit_conn edge_conn 20;

    location /api/admin/ {
        limit_req zone=edge_api burst=20 nodelay;
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Correlation-Id $request_id;
        proxy_set_header X-Internal-Token "";
    }
    location /api/ { return 404; }        # chat API is not exposed on the admin origin
    location /ws { return 404; }

    location / {
        set $admin_ui admin-portal:8080;
        proxy_pass http://$admin_ui;
        proxy_set_header Host $host;
    }
}
